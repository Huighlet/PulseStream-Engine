[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsestream-engine"
version = "1.0.0"
description = "High-Throughput In-Memory Event Streaming Broker, Partition Commit Log & Window Aggregator"
readme = "README.md"
authors = [{ name = "Huighlet Eyram Zowonu" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pulsestream = "pulsestream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
